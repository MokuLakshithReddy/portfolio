name: Refresh GitHub contribution snapshot

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-contributions-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh rolling-year contribution calendar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Fetch and validate contribution calendar
        run: node scripts/sync-github-contributions.mjs

      - name: Commit updated snapshot when changed
        run: |
          if git diff --quiet -- src/data/githubData.ts; then
            echo "Contribution snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/githubData.ts
          git commit -m "chore(stats): refresh rolling-year contribution snapshot"
          git push origin HEAD:main
