name: Sync GitHub Contributions

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/sync-contributions.mjs'
  workflow_dispatch:
  repository_dispatch:
    types: [contribution-event, sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CONTRIBUTIONS_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Contributions Calendar
        env:
          CONTRIBUTIONS_PAT: ${{ secrets.CONTRIBUTIONS_PAT }}
        run: node scripts/sync-contributions.mjs

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/githubData.ts
          if git diff --staged --quiet; then
            echo "No contribution changes detected."
          else
            echo "New contributions detected! Committing and pushing..."
            git commit -m "chore(contributions): sync latest GitHub contribution activity [skip ci]"
            git push origin main
          fi
