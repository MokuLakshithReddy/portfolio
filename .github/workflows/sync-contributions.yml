name: Sync GitHub Contributions

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/sync-contributions.mjs'
  workflow_dispatch:
  repository_dispatch:
    types: [contribution-event, sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # The repository token is sufficient for checkout and pushing updates.
          # Keep the user-scoped PAT isolated to the contribution GraphQL query.
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate contribution API credential
        env:
          CONTRIBUTIONS_PAT: ${{ secrets.CONTRIBUTIONS_PAT }}
        run: |
          if [ -z "$CONTRIBUTIONS_PAT" ]; then
            echo "::error::CONTRIBUTIONS_PAT is not configured. Add a user-scoped GitHub token that can read the account contribution calendar."
            exit 1
          fi

      - name: Sync Contributions Calendar
        env:
          CONTRIBUTIONS_PAT: ${{ secrets.CONTRIBUTIONS_PAT }}
        run: node scripts/sync-contributions.mjs

      - name: Create contribution update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          add-paths: src/data/githubData.ts
          branch: automation/contribution-calendar-sync
          commit-message: "chore(contributions): sync latest GitHub contribution activity"
          title: "chore(contributions): update GitHub contribution calendar"
          body: |
            Automated update of the public GitHub contribution calendar.
            This pull request is generated by the scheduled portfolio sync workflow.
          delete-branch: true
